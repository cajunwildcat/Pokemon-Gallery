name: Update TCGdex database

on:
  schedule:
    - cron: "0 0 1 * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download current set and card data
        run: node build-data.js

      - name: Commit database updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcgdex-database.json build-data-errors.log
          if ! git diff --cached --quiet; then
            git commit -m "Update TCGdex card database"
            git push
          fi
